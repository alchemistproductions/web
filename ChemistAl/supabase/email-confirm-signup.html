<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#07090d">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#07090d"><tr><td align="center" style="padding:40px 14px">
<table role="presentation" width="520" cellpadding="0" cellspacing="0" style="width:100%;max-width:520px;background:#0e121a;border:1px solid #232a38;border-radius:22px;overflow:hidden">
<tr><td style="height:4px;font-size:0;line-height:0;background:#f4ff00;background-image:linear-gradient(90deg,#ff4a2b,#f4ff00,#2f8bff,#b58cff)">&nbsp;</td></tr>
<tr><td align="center" style="padding:40px 32px 0"><img src="{{ .SiteURL }}/logo.png" width="72" height="72" alt="" style="display:block;border-radius:50%"></td></tr>
<tr><td align="center" style="padding:18px 32px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#8b93a7">Alchemist Productions</td></tr>
<tr><td align="center" style="padding:12px 32px 0;font-family:Arial,Helvetica,sans-serif;font-size:30px;line-height:1.2;font-weight:700;color:#ffffff">Your verification code</td></tr>
<tr><td align="center" style="padding:12px 40px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#aab1c2">Enter this code on the site to continue. It expires in 1 hour.</td></tr>
<tr><td align="center" style="padding:28px 32px 0"><table role="presentation" cellpadding="0" cellspacing="0"><tr><td align="center" style="background:#07090d;border:1px solid #2f384a;border-radius:16px;padding:18px 14px 18px 32px;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:40px;font-weight:700;letter-spacing:14px;color:#f4ff00;user-select:all;-webkit-user-select:all">{{ .Token }}</td></tr></table></td></tr>
<tr><td align="center" style="padding:10px 32px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#6c7488">Tap and hold the code to copy it</td></tr>
<tr><td align="center" style="padding:28px 32px 8px"><a href="{{ .SiteURL }}/login?email={{ .Email }}&amp;code={{ .Token }}" style="display:inline-block;background:#f4ff00;border-radius:999px;padding:15px 34px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#07090d;text-decoration:none">Verify in one tap &rarr;</a></td></tr>
<tr><td style="padding:30px 32px 34px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="border-top:1px solid #232a38;padding-top:20px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#6c7488">Didn't request this? You can safely ignore this email.<br>Alchemist Productions &middot; Hyderabad, Telangana</td></tr></table></td></tr>
</table></td></tr></table></body></html>
