<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#0a0d12">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0d12;padding:32px 12px"><tr><td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#10141c;border:1px solid #262c38">
<tr><td><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
<td style="height:8px;background:#ff4a2b"></td><td style="background:#a9b4ff"></td><td style="background:#f4ff00"></td><td style="background:#ffffff"></td><td style="background:#2f8bff"></td><td style="background:#e9e2cf"></td><td style="background:#e50914"></td><td style="background:#1e88ff"></td><td style="background:#d9b13b"></td></tr></table></td></tr>

<tr><td align="center" style="font-family:Georgia,serif;font-style:italic;color:#b8bcc8;font-size:16px;padding:6px 24px 24px">Welcome to a new era</td></tr>
<tr><td align="center" style="font-family:Georgia,serif;color:#e8eaf0;font-size:17px;line-height:1.6;padding:0 36px">Use this code to verify your email and join the community. It expires in 1 hour.</td></tr>
<tr><td align="center" style="padding:26px 24px 6px"><table role="presentation" cellpadding="0" cellspacing="0"><tr>
